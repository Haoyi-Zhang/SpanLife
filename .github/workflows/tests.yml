name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: src
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt -r requirements-figures.txt
      - name: Test code and recorded inputs
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q
          python scripts/check_retained_records.py
      - name: Test optimized execution and recorded-input gates
        shell: bash
        run: |
          set -euo pipefail
          python -O -m pytest -q
          python -O scripts/check_retained_records.py
      - name: Exercise CLI integration exit contracts without an SDK
        run: python -B -S scripts/ci_contract_smoke.py
